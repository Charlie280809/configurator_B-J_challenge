<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./src/assets/B&J_favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestelling - Ben & Jerry's Ice Cream Configurator</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
    <main class="experience order-experience">
        <section class="hero order-hero">
            <img src="./src/assets/Ben_&_Jerry's.svg.webp" alt="Logo">
            <div>
                <h1>Bestel je ijscup</h1>
            </div>
        </section>

        <section class="order-layout">
            <article class="panel summary-card">
                <h2>Jouw bestelling:</h2>

                <dl class="summary-list">
                    <div class="summary-item">
                        <dt>Smaak </dt>
                        <dd id="summary-flavor">Nog niet gekozen</dd>
                    </div>
                    <div class="summary-item">
                        <dt>Toppings </dt>
                        <dd id="summary-toppings">Geen toppings</dd>
                    </div>
                    <div class="summary-item">
                        <dt>Saus </dt>
                        <dd id="summary-sauce">Geen saus</dd>
                    </div>
                </dl>

                <section class="price-box" aria-live="polite">
                    <p>Totaalprijs:</p>
                    <strong id="checkout-price">€0,00</strong>
                </section>

                <a class="secondary-link" href="/index.html">&#8592; Bestelling aanpassen</a>
            </article>

            <section class="panel order-panel">
                <form id="checkout-form">
                    <h2>Jouw gegevens:</h2>
                    <fieldset>

                        <div class="order-form-row">
                            <label class="field" for="checkout-name">Naam
                                <input type="text" id="checkout-name" name="name" placeholder="Familienaam"
                                    maxlength="30" required />
                            </label>

                            <label class="field" for="checkout-surname">Voornaam
                                <input type="text" id="checkout-surname" name="surname" placeholder="Voornaam"
                                    maxlength="30" required />
                            </label>
                        </div>

                        <div class="order-form-row">
                            <label class="field" for="checkout-street">Straat
                                <input type="text" id="checkout-street" name="street" placeholder="Straatnaam"
                                    maxlength="100" required />
                            </label>

                            <label class="field" for="checkout-number">Huisnummer
                                <input type="text" id="checkout-number" name="number" placeholder="Nr." maxlength="10"
                                    required />
                            </label>

                        </div>

                        <div class="order-form-row">
                            <label class="field" for="checkout-postal">Postcode
                                <input type="text" id="checkout-postal" name="postal" placeholder="Postcode"
                                    maxlength="100" required />
                            </label>

                            <label class="field" for="checkout-city">Gemeente
                                <input type="text" id="checkout-city" name="city" placeholder="Gemeentenaam"
                                    maxlength="100" required />
                            </label>

                        </div>

                    </fieldset>

                    <button class="cta-button" type="submit">Bevestig bestelling</button>

                    <div id="confirmationMessage" class="confirmation-message" aria-live="polite"></div>
                </form>
            </section>
        </section>
    </main>

    <script>
        const flavorLabels = {
            vanille: 'Vanille',
            chocolate: 'Chocolate Fudge Brownie',
            strawberry: 'Strawberry Cheesecake',
            'cookie-dough': 'Cookie Dough',
        };

        const sauceLabels = {
            chocolate: 'Chocoladesaus',
            caramel: 'Caramelsaus',
            strawberry: 'Aardbeiensaus',
            'white-chocolate': 'Witte chocoladesaus',
        };

        const toppingsLabels = {
            'choc-chips': 'Choco chips',
            'cookie-crumble': 'Cookie crumble',
            marshmallow: 'Marshmallow',
            sprinkles: 'Sprinkles',
        };

        const params = new URLSearchParams(window.location.search);
        const flavor = params.get('flavor') || '';
        const toppingsRaw = params.get('toppings');
        const toppings = toppingsRaw ? toppingsRaw.split(',') : [];
        const sauce = params.get('sauce') || '';

        const flavorEl = document.getElementById('summary-flavor');
        const toppingsEl = document.getElementById('summary-toppings');
        const sauceEl = document.getElementById('summary-sauce');
        const checkoutPriceEl = document.getElementById('checkout-price');
        const form = document.getElementById('checkout-form');

        function formatPrice(value) {
            return `€ ${value.toFixed(2).replace('.', ',')}`;
        }

        function calculatePrice() {
            let total = 0;

            if (flavor) total += 4.5;
            if (sauce) total += 0.5;
            total += toppings.length * 0.4;

            return total;
        }

        const totalPrice = calculatePrice();

        if (flavorEl) {
            flavorEl.textContent = flavorLabels[flavor] || 'Nog niet gekozen';
        }

        if (toppingsEl) {
            const selectedToppings = toppings
                .map((topping) => toppingsLabels[topping] || topping)
                .join(', ');
            toppingsEl.textContent = selectedToppings || 'Geen toppings';
        }

        if (sauceEl) {
            sauceEl.textContent = sauceLabels[sauce] || 'Geen saus';
        }

        if (checkoutPriceEl) {
            checkoutPriceEl.textContent = formatPrice(totalPrice);
        }

        if (form) {
            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const nameValue = document.getElementById('checkout-name')?.value.trim();
                const surnameValue = document.getElementById('checkout-surname')?.value.trim();
                const streetValue = document.getElementById('checkout-street')?.value.trim();
                const numberValue = document.getElementById('checkout-number')?.value.trim();
                const postalValue = document.getElementById('checkout-postal')?.value.trim();
                const cityValue = document.getElementById('checkout-city')?.value.trim();

                if (!nameValue || !surnameValue || !streetValue || !numberValue || !postalValue || !cityValue) {
                    alert('Vul alle adresgegevens in.');
                    return;
                }

                const orderData = {
                    customerName: `${surnameValue} ${nameValue}`,
                    address: {
                        street: streetValue,
                        houseNumber: numberValue,
                        postalCode: postalValue,
                        city: cityValue
                    },
                    smaak: flavor,
                    toppings: toppings,
                    saus: sauce,
                    totalPrice: totalPrice
                };

                try {
                    const response = await fetch('https://api-b-j-challenge.onrender.com/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderData)
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.message || 'Fout bij bestellen');
                    }

                    const result = await response.json().catch(() => ({}));
                    alert(`Bestelling geplaatst! Ordernummer: ${result._id || 'n.v.t.'}`);
                    form.reset();
                } catch (error) {
                    console.error('Fout:', error);
                    alert('Bestelling mislukt: ' + error.message);
                }
            });
        }
    </script>
</body>

</html>
